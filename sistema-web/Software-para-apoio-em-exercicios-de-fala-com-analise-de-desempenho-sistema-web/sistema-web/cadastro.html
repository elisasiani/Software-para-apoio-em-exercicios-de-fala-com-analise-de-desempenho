<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Liri</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">
      <img src="/img/girafa.png" alt="Girafa Liri"
        style="width: 32px; height: 32px; object-fit: contain; vertical-align: middle;">
      Liri
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="QuemSomos.html">Quem Somos</a>
      <a href="login.html" class="btn">Área do Profissional</a>
    </nav>
  </header>

  <section class="secao-cadastro">
    <div class="cartao-cadastro">

      <h2>Área do Profissional</h2>
      <p class="subtitulo">Crie sua conta</p>

      <!-- Mensagem de feedback (erro ou sucesso) -->
      <div id="mensagem" style="
        display: none;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.9rem;
      "></div>

      <form id="form-cadastro">

        <div class="grupo-input">
          <label for="nome">Nome completo</label>
          <input id="nome" type="text" placeholder="Seu nome" required>
        </div>

        <div class="grupo-input">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" required>
        </div>

        <div class="grupo-input">
          <label for="cpf">CPF</label>
          <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="grupo-input">
          <label for="telefone">Telefone</label>
          <input id="telefone" type="tel" placeholder="(11) 91234-5678" maxlength="15" required>
        </div>

        <div class="grupo-input">
          <label for="crfa">CRFa</label>
          <input id="crfa" type="text" placeholder="Ex: 1-12345" required>
        </div>

        <div class="grupo-input">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="grupo-input">
          <label for="confirmar-senha">Confirmar Senha</label>
          <input id="confirmar-senha" type="password" placeholder="********" required>
        </div>

        <button type="submit" class="botao-entrar" id="btn-cadastrar">Cadastrar</button>

      </form>

      <div class="links-rodape">
        Já tem uma conta? <a href="login.html">Faça login</a>
      </div>

    </div>
  </section>

  <footer class="rodape">
    <div class="rodape-container">
      <div class="rodape-grade">

        <div class="rodape-coluna">
          <h4 class="rodape-titulo">Navegação</h4>
          <ul class="rodape-lista">
            <li><a href="index.html">Início</a></li>
            <li><a href="QuemSomos.html">Quem Somos</a></li>
          </ul>
        </div>

        <div class="rodape-coluna">
          <h4 class="rodape-titulo">Acesso</h4>
          <ul class="rodape-lista">
            <li><a href="cadastro.html">Área do Profissional</a></li>
          </ul>
        </div>

        <div class="rodape-coluna">
          <h4 class="rodape-titulo">Contato</h4>
          <address class="rodape-contato">
            <p>contato@liri.com.br</p>
            <p>(11) 3456-7890</p>
            <p>São Paulo, SP</p>
          </address>
        </div>

      </div>
    </div>

    <div class="rodape-inferior">
      <p>&copy; 2025 Liri. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="script.js"></script>

  

  <script type="module" src="cadastro.js"></script>
</body>

</html>
